# Отдельный сайт. Не заменяет другие server-блоки и не выпускает сертификаты для чужих имён.
# Подключение: скопировать в sites-available и включить только этот файл.
# Сертификат, когда будет доступ к серверу: certbot --nginx -d leadflow.siteaccess.ru

server {
    listen 80;
    server_name leadflow.siteaccess.ru;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
